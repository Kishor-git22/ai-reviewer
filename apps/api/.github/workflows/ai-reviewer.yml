name: AI Code Review (NVIDIA NIM)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: AI Code Review (NVIDIA NIM)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AI Review
        env:
          APP_URL: "https://ai-reviewer-app-gamma.vercel.app"
        run: |
          echo "Triggering AI Review on the backend..."
          curl -s -X POST "$APP_URL/webhooks/github" \
            -H "Content-Type: application/json" \
            -d '${{ toJson(github.event) }}'

      - name: Poll AI Review Status
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.event.repository.name }}
          APP_URL: "https://ai-reviewer-app-gamma.vercel.app"
        run: |
          node -e '
          const https = require("https");
          const appUrl = process.env.APP_URL;
          const repoName = process.env.REPO_NAME;
          const prNumber = process.env.PR_NUMBER;
          const url = `${appUrl}/reviewer/repo/${repoName}/pr/${prNumber}/status`;

          const startTime = Date.now();
          const ESTIMATED_TOTAL = 50; // seconds
          let count = 0;

          function getStatus() {
            if (count > 20) {
              console.log("❌ Timeout waiting for AI Review to complete.");
              process.exit(1);
            }

            https.get(url, (res) => {
              if (res.statusCode !== 200) {
                console.log(`⚠️ Status endpoint returned HTTP ${res.statusCode}. (If 404, please push your backend changes to Vercel first!)`);
                count++;
                setTimeout(getStatus, 15000);
                return;
              }

              let data = "";
              res.on("data", (chunk) => { data += chunk; });
              res.on("end", () => {
                try {
                  const json = JSON.parse(data);
                  if (!json || !json.status) {
                    console.log(`Waiting for status endpoint to respond...`);
                    count++;
                    setTimeout(getStatus, 15000);
                    return;
                  }

                  const elapsed = Math.floor((Date.now() - startTime) / 1000);
                  
                  if (json.status === "not_found") {
                    console.log(`Waiting for AI Review to start... (Elapsed: ${elapsed}s)`);
                    count++;
                    setTimeout(getStatus, 15000);
                    return;
                  }

                  const modelNames = (json.models || []).map(m => {
                    if (m.includes("llama")) return "Llama 3.1 🦙";
                    if (m.includes("deepseek")) return "DeepSeek V4 Flash ⚡";
                    if (m.includes("mistral")) return "Mistral Small 4 ⚡";
                    return m;
                  }).join(", ");

                  const createdTime = json.createdAt ? new Date(json.createdAt).getTime() : startTime;
                  const actualElapsed = Math.floor((Date.now() - createdTime) / 1000);
                  
                  // Calculate remaining and completion time
                  const remaining = Math.max(0, ESTIMATED_TOTAL - actualElapsed);
                  const completionTime = new Date(createdTime + ESTIMATED_TOTAL * 1000);
                  const completionStr = completionTime.toLocaleTimeString("en-IN", {
                    timeZone: "Asia/Kolkata",
                    hour12: false
                  }) + " IST";

                  console.log("\n" + "=".repeat(40));


                  console.log(`🤖 Status:           ${json.status.toUpperCase()}`);
                  if (modelNames) {
                    console.log(`👥 Active Agents:    ${modelNames}`);
                  }
                  console.log(`⏱️  Elapsed Time:     ${actualElapsed}s`);
                  if (json.status === "in_progress" || json.status === "pending") {
                    console.log(`⏳ Est. Time Left:   ${remaining}s`);
                    console.log(`⏰ Est. Completion:  ${completionStr}`);
                  }
                  console.log("=".repeat(40));

                  if (json.status === "completed") {
                    console.log("✅ AI Review completed successfully!");
                    process.exit(0);
                  } else if (json.status === "stopped") {
                    console.log("🛑 AI Review stopped (PR closed).");
                    process.exit(0);
                  } else if (json.status === "failed") {
                    console.log("❌ AI Review failed.");
                    process.exit(1);
                  } else {
                    count++;
                    setTimeout(getStatus, 15000);
                  }
                } catch (err) {
                  console.log(`Error parsing response: ${err.message}`);
                  count++;
                  setTimeout(getStatus, 15000);
                }
              });
            }).on("error", (err) => {
              console.log(`Connection error: ${err.message}`);
              count++;
              setTimeout(getStatus, 15000);
            });
          }

          getStatus();
          '
